<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>存档备份</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="brand">存档备份</div>
    <label class="toggle"><input type="checkbox" id="showAuto" /> 显示自动备注节点</label>
    <label class="toggle"><input type="checkbox" id="showRemarks" checked /> 显示备注</label>
    <span class="seg" title="树图连线">
      <button type="button" id="btnCurve">曲线</button>
      <button type="button" id="btnStraight">直线</button>
    </span>
    <button type="button" id="btnPauseAll">暂停自动备份</button>
  </header>
  <main>
    <aside id="side">
      <div class="side-head">
        <h2>我的游戏</h2>
        <button type="button" id="btnAdd" title="添加游戏存档">+</button>
      </div>
      <ul id="itemList"></ul>
    </aside>
    <section id="graphPane">
      <button type="button" id="btnSide" title="隐藏游戏列表">‹</button>
      <div id="empty">
        <p>选一个游戏存档所在的文件夹，之后会自动帮你记住每一版。</p>
        <button type="button" id="btnAddBig">选择游戏存档</button>
      </div>
      <div id="graphWrap" hidden>
        <div id="graphWorld">
          <svg id="graph"></svg>
        </div>
      </div>
      <button type="button" id="btnFit" hidden title="把整张图放进窗口">最佳展示</button>
    </section>
  </main>
  <ul id="menu" hidden></ul>
  <div id="dlg" hidden>
    <div class="dlg-card" role="dialog">
      <p id="dlgMsg"></p>
      <input id="dlgInput" type="text" hidden />
      <div class="dlg-btns">
        <button type="button" id="dlgCancel">取消</button>
        <button type="button" id="dlgOk">确定</button>
      </div>
    </div>
  </div>
  <div id="busy" hidden>
    <div class="busy-card">
      <div class="spin" aria-hidden="true"></div>
      <p id="busyText">正在切换进度…</p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
